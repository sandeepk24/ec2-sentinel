name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 mypy

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Type check
        run: |
          mypy --ignore-missing-imports sentinel.py collectors/ alerts.py || true

      - name: Smoke test — imports
        run: |
          python -c "from collectors.system import collect_cpu, collect_memory, collect_disks"
          python -c "from collectors.process import collect_processes"
          python -c "from collectors.logs import collect_logs"
          python -c "from collectors.ports import collect_ports"
          python -c "from collectors.docker import collect_docker"
          python -c "from collectors.java import collect_java"
          python -c "from collectors.top import collect_top"
          python -c "from analyzers.diagnose import diagnose"
          python -c "from alerts import Alert, dispatch_alerts"

      - name: Smoke test — system collection
        run: |
          cd $GITHUB_WORKSPACE
          python -c "
          from collectors.system import collect_system, collect_os_info, collect_ec2_metadata
          report = collect_system()
          print(f'CPU: {report.cpu.usage_percent}%')
          print(f'Memory: {report.memory.used_percent}%')
          print(f'Disks: {len(report.disks)}')
          print(f'Uptime: {report.uptime_human}')
          print(f'OS: {report.os.display}')
          print(f'Instance type: {report.ec2.instance_type} ({report.ec2.cloud_provider}/{report.ec2.detection_source})')
          assert report.cpu.core_count > 0
          assert report.memory.total_bytes > 0
          assert report.os.id != 'unknown' or report.os.platform != 'unknown'
          assert report.ec2.instance_type != 'unknown'
          osinfo = collect_os_info()
          print(f'OS family={osinfo.family} id={osinfo.id} version={osinfo.version_id}')
          meta = collect_ec2_metadata()
          print(f'Meta source={meta.detection_source} type={meta.instance_type}')
          from analyzers.disk_growth import predict_disk_growth
          import time
          total = 100 * 1024**3
          now = time.time()
          samples = [
              {'ts': now - 2*86400, 'used_bytes': 40*1024**3, 'total_bytes': total},
              {'ts': now, 'used_bytes': 50*1024**3, 'total_bytes': total},
          ]
          pred = predict_disk_growth(50*1024**3, total, samples)
          assert pred.ready and pred.trend == 'growing'
          assert pred.days_until_80 is not None and pred.predicted_full_date
          print(f'Disk growth: {pred.growth_gb_per_day} GB/day · full {pred.predicted_full_date}')
          print('All system checks passed')
          "

      - name: Smoke test — port checker
        run: |
          python -c "
          from collectors.ports import collect_ports
          report = collect_ports([{'name': 'test', 'port': 59999}])
          assert len(report.checks) == 1
          assert not report.checks[0].is_open
          print('Port check works')
          "

      - name: Smoke test — docker collector
        run: |
          python -c "
          from collectors.docker import collect_docker
          report = collect_docker({'enabled': True})
          print(f'Docker available: {report.available}')
          if report.error:
              print(f'Note: {report.error}')
          print('Docker collector works')
          "

      - name: Smoke test — java collector
        run: |
          python -c "
          from collectors.java import collect_java
          from collectors.jvm_stats import JavaJvmStats, _evaluate_stats, jvm_stats_to_dict
          report = collect_java({'enabled': True, 'jvm_stats': False})
          print(f'Java enabled: {report.enabled}, available: {report.available}')
          for j in report.installations:
              print(f'  {j.display} @ {j.path}')
          if report.error and not report.available:
              print(f'Note: {report.error}')
          s = JavaJvmStats(pid=1, heap_used_percent=92, thread_count=800)
          _evaluate_stats(s, {'heap_warn_percent': 85, 'thread_warn': 500})
          assert s.heap_pressure and s.high_threads
          d = jvm_stats_to_dict(s)
          assert 'heap_used_percent' in d and d['issues']
          print('Java collector works')
          "

      - name: Smoke test — top consumers + diagnosis
        run: |
          python -c "
          from collectors.system import collect_system
          from collectors.top import collect_top
          from analyzers.diagnose import diagnose, diagnosis_to_dict
          from analyzers.cpu_anomaly import detect_cpu_anomaly, HISTORY_FILE
          system = collect_system()
          top = collect_top(limit=5, sample_seconds=0.5)
          d = diagnose(system, top)
          assert d.headline and d.cpu_story and d.memory_story
          print(d.headline)
          print(d.summary)
          print(f'Top CPU: {len(top.by_cpu)}, Top MEM: {len(top.by_memory)}')
          print('Diagnosis works')
          # Lightweight anomaly detector (history file)
          if HISTORY_FILE.exists():
              HISTORY_FILE.unlink()
          for v in [18, 20, 19, 21, 22, 20]:
              detect_cpu_anomaly(v, top)
          spike = detect_cpu_anomaly(75.0, top)
          assert spike.ready and spike.is_anomaly
          assert spike.baseline_percent < spike.current_percent
          assert spike.reason
          print(f'Anomaly OK: {spike.reason[:80]}')
          "

      - name: Smoke test — log scanner
        run: |
          echo 'ERROR something went wrong' > /tmp/test_sentinel.log
          echo 'INFO all good' >> /tmp/test_sentinel.log
          echo 'FATAL crash' >> /tmp/test_sentinel.log
          python -c "
          from collectors.logs import collect_logs
          report = collect_logs(['ERROR', 'FATAL'], ['/tmp/test_sentinel.log'], incremental=False)
          assert report.total_hits == 2
          print(f'Found {report.total_hits} matches across {report.files_scanned} files')
          print('Log scanner works')
          "

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build React dashboard
        run: |
          cd reporters/web-ui
          npm ci
          npm run build
          test -f ../web/dist/index.html

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh install.sh || true
